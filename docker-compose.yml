version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contador_postgres
    environment:
      POSTGRES_DB: contador_de_impactos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@ndrey1212AA"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: contador_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contador_de_impactos
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=@ndrey1212AA
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata: